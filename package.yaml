name:                poco
version:             0.1.0.0
github:              "pixelcmtd/poco"
license:             GPL-2.0-only
author:              "Pixel Häußler"
maintainer:          "pixel.github@chrissx.de"
copyright:           "2026 Pixel Häußler"

extra-source-files:
- README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web
description:         Please see the README on GitHub at <https://github.com/pixelcmtd/poco#readme>

dependencies:
- base >=4.7 && <5
- yaml ^>=0.11
- aeson ^>=2.2
- text ^>=2.1
- optparse-applicative ^>=0.18
- containers ^>=0.7
- recursion-schemes ^>=5.2

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  poco-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - poco

tests:
  poco-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - poco
